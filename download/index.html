<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Лимит</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1016;
      --card: #171a22;
      --text: #f4f6fb;
      --muted: #9aa3b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      padding: 24px 18px 48px;
    }
    main { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.45; font-size: 17px; }
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 16px;
      margin: 20px 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Лимит</h1>
    <p>Ничего забирать и вписывать не нужно. Ни процент, ни дату, ни кредиты.</p>
    <section class="card">
      <p>Эта страница не видит вход в Курсор, поэтому сама лимит не обновляет. Поля для ручного ввода убраны.</p>
      <p>Цифры должен забирать виджет на рабочем столе после одного входа через Google, GitHub или почту.</p>
    </section>
  </main>
</body>
</html>
